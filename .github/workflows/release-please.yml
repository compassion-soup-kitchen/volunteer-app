name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
          package-name: volunteer-app
          # The app moved into apps/web in the monorepo; release-please now
          # manages apps/web/package.json + apps/web/CHANGELOG.md.
          path: apps/web
